name: Slick Browser APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Smart Auto-Fix Kotlin Code
        run: |
          python3 - << 'EOF'
          import glob, re

          for path in glob.glob("app/src/main/**/*.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()

              # 1. Добавляем забытый импорт nativeCanvas
              if "nativeCanvas" in code and "import androidx.compose.ui.graphics.nativeCanvas" not in code:
                  code = re.sub(r'(package\s+[^\n]+\n)', r'\1import androidx.compose.ui.graphics.nativeCanvas\n', code, count=1)

              # 2. Чиним несуществующую константу SSL
              code = code.replace("WebViewClient.ERROR_SSL_HANDSHAKE", "-11")
              code = code.replace("ERROR_SSL_HANDSHAKE", "-11")

              # 3. Чиним platformImeOptions (заменяем любой вызов со скобками на null)
              code = re.sub(r'import\s+.*PlatformImeOptions.*\n', '', code)
              code = re.sub(r'platformImeOptions\s*=\s*PlatformImeOptions\s*\([^)]*\)\s*(\{[^}]*\})?', 'platformImeOptions = null', code, flags=re.DOTALL)
              code = re.sub(r'platformImeOptions\s*=\s*\{[^}]*\}', 'platformImeOptions = null', code, flags=re.DOTALL)
              code = re.sub(r'platformImeOptions\s*=\s*[A-Za-z0-9_.]+\s*(\([^)]*\))?\s*(\{[^}]*\})?', 'platformImeOptions = null', code, flags=re.DOTALL)

              # 4. Чиним опечатку array(...) в SlickTheme.kt
              code = re.sub(r'\barray\s*\(', 'arrayOf(', code)
              code = re.sub(r'R\.array\.[a-zA-Z0-9_]+', '0', code)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slick-browser-apk
          path: app/build/outputs/apk/debug/*.apk
