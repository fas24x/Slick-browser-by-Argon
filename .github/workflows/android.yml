name: Slick Browser APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Smart Auto-Fix Kotlin Code
        run: |
          python3 - << 'EOF'
          import glob, re

          for path in glob.glob("app/src/main/**/*.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()

              # 1. Чиним LiquidFogEngine.kt (добавляем import nativeCanvas)
              if "nativeCanvas" in code and "import androidx.compose.ui.graphics.nativeCanvas" not in code:
                  code = re.sub(r'(package\s+[^\n]+\n)', r'\1import androidx.compose.ui.graphics.nativeCanvas\n', code, count=1)

              # 2. Чиним WebViewPoolManager.kt (меняем константу SSL на -11)
              code = code.replace("WebViewClient.ERROR_SSL_HANDSHAKE", "-11")
              code = code.replace("ERROR_SSL_HANDSHAKE", "-11")

              # 3. Чиним SlickTheme.kt (меняем array( на arrayOf()
              code = re.sub(r'\barray\s*\(', 'arrayOf(', code)
              code = re.sub(r'R\.array\.[a-zA-Z0-9_]+', '0', code)

              # 4. Чиним MainActivity.kt без ломания скобок!
              if "MainActivity.kt" in path:
                  # Убираем нерабочий импорт на 38 строке
                  code = re.sub(r'import\s+.*PlatformImeOptions.*\n', '', code)
                  # Убираем сломанную строчку ~854 в конце файла, если она там есть
                  code = re.sub(r'^.*PlatformImeOptions.*$', lambda m: '' if 'platformImeOptions' not in m.group(0) else m.group(0), code, flags=re.MULTILINE)
                  # Заменяем вызов platformImeOptions = ... целиком до конца строки на null, сохраняя запятую или скобку
                  lines = code.splitlines()
                  new_lines = []
                  for line in lines:
                      if "platformImeOptions" in line and "=" in line:
                          # Проверяем, закрывается ли на этой строке весь KeyboardOptions
                          stripped = line.rstrip()
                          if stripped.endswith("),"):
                              new_lines.append("platformImeOptions = null),")
                          elif stripped.endswith(","):
                              new_lines.append("platformImeOptions = null,")
                          else:
                              new_lines.append("platformImeOptions = null")
                      else:
                          new_lines.append(line)
                  code = "\n".join(new_lines)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slick-browser-apk
          path: app/build/outputs/apk/debug/*.apk
