name: Slick Browser APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-fix code typos
        run: |
          # 1. Чиним LiquidFogEngine.kt (добавляем забытый import nativeCanvas)
          sed -i '1s/^/import androidx.compose.ui.graphics.nativeCanvas\n/' app/src/main/java/com/slick/browser/ui/effects/LiquidFogEngine.kt
          sed -i '/^package /s/$/\nimport androidx.compose.ui.graphics.nativeCanvas/' app/src/main/java/com/slick/browser/ui/effects/LiquidFogEngine.kt
          sed -i '1{/^import/d;}' app/src/main/java/com/slick/browser/ui/effects/LiquidFogEngine.kt

          # 2. Чиним WebViewPoolManager.kt (меняем неправильное слово на -11)
          sed -i 's/WebViewClient\.ERROR_SSL_HANDSHAKE/-11/g' app/src/main/java/com/slick/browser/web/WebViewPoolManager.kt
          sed -i 's/ERROR_SSL_HANDSHAKE/-11/g' app/src/main/java/com/slick/browser/web/WebViewPoolManager.kt

          # 3. Чиним MainActivity.kt (убираем нерабочий PlatformImeOptions)
          sed -i '/PlatformImeOptions/d' app/src/main/java/com/slick/browser/MainActivity.kt
          sed -i '/platformImeOptions/d' app/src/main/java/com/slick/browser/MainActivity.kt

          # 4. Чиним SlickTheme.kt (заменяем array( на arrayOf()
          sed -i 's/\barray(/arrayOf(/g' app/src/main/java/com/slick/browser/ui/theme/SlickTheme.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slick-browser-apk
          path: app/build/outputs/apk/debug/*.apk
