name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]  # Срабатывает при любом пуше в основную ветку
  workflow_dispatch:           # Добавляет кнопку ручного запуска в Actions

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Стянуть репозиторий
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Дать права на запуск gradlew
        run: chmod +x gradlew

      - name: Собрать Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Выгрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
